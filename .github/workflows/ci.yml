name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only PyTorch keeps the install small; GPU is not needed for the tests.
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install numpy pandas scipy scikit-learn scikit-image scikit-fuzzy \
            opencv-python-headless matplotlib seaborn tqdm mahotas kneed
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install segmentation-models-pytorch albumentations
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
