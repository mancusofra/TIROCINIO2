name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests cover the non-deep-learning modules only, so TensorFlow/PyTorch
      # are deliberately not installed here.
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install numpy pandas scipy scikit-learn scikit-image scikit-fuzzy \
            opencv-python-headless matplotlib seaborn tqdm mahotas kneed
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
