[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Long lines are mostly docstrings/comments; the formatter handles code.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"yeast_vacuole_pipeline/features_extraction/features_extraction.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
