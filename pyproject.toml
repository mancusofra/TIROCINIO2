[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Long lines are mostly docstrings/comments; the formatter handles code.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook-style modules with documented dead code / late imports (see their docstrings).
"yeast_vacuole_pipeline/unet_segmentation/*.py" = ["E402", "F821", "F841"]
"yeast_vacuole_pipeline/features_extraction/features_extraction.py" = ["F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
